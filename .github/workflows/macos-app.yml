name: macOS app (.app)

# Собирает несигнованный (ad-hoc) Nekko.app под Apple Silicon: движок (dylib) +
# Flutter-UI. Каркас macos/ в репо отсутствует, поэтому генерируется на лету
# через `flutter create --platforms=macos`.
#
# ВАЖНО: это тестовая сборка UI. VPN-туннель под macOS ещё заглушка
# (engine/core/vpn/process_other.go) — окно и интерфейс работают, кнопка
# «подключиться» вернёт ошибку. Приложение только ad-hoc-подписано, без
# нотаризации: на маке снимай карантин `xattr -cr Nekko.app` перед запуском.

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'engine/**'
      - '.github/workflows/macos-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'engine/**'
      - '.github/workflows/macos-app.yml'
  workflow_dispatch:

jobs:
  build:
    name: build Nekko.app (arm64, unsigned)
    runs-on: macos-14        # Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build engine dylib (darwin/arm64)
        working-directory: engine
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -buildmode=c-shared -o "$GITHUB_WORKSPACE/libnekkobox.dylib" ./cmd/nekkobox-ffi
          file "$GITHUB_WORKSPACE/libnekkobox.dylib"

      - name: Generate macOS scaffold + deps
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --project-name nekkobox .
          flutter pub get

      - name: Build macOS app (ad-hoc signed)
        working-directory: app
        env:
          # Ad-hoc подпись ("-"): без Apple Developer аккаунта, но обязательна
          # чтобы бинарь вообще запускался на Apple Silicon.
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
        run: flutter build macos --release

      - name: Bundle dylib into .app and re-sign
        working-directory: app
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then echo "::error::.app not found"; exit 1; fi
          echo "APP_PATH=$APP_PATH"
          cp "$GITHUB_WORKSPACE/libnekkobox.dylib" "$APP_PATH/Contents/MacOS/"
          # Пересобрать ad-hoc подпись бандла — иначе добавленный dylib
          # ломает подпись и macOS не запустит приложение.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" || true
          # ditto сохраняет структуру бандла, symlink'и и подпись (в отличие
          # от обычного zip, который их портит).
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/Nekko-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nekko-macos-arm64
          path: Nekko-macos-arm64.zip
          if-no-files-found: error
