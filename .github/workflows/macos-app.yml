name: macOS app (.app)

# Собирает несигнованный (ad-hoc) Nekko.app под Apple Silicon:
#   движок (libnekkobox.dylib) + Flutter-UI + бинарь sing-box.
# Каркас macos/ в репо отсутствует — генерируется на лету через
# `flutter create --platforms=macos`.
#
# sing-box берётся НЕ из официального релиза: конфиги проекта используют
# AmneziaWG-эндпоинты ("type": "awg"), которых нет в upstream. Поэтому
# собираем форк hoaxisr/amnezia-box (тег SINGBOX_TAG) под darwin/arm64 с
# тегом with_awg — тот же бинарь, что и в Windows-сборке.
#
# ВАЖНО: приложение только ad-hoc-подписано, без нотаризации — на маке снимай
# карантин `xattr -cr Nekko.app`. Для реального туннеля sing-box нужен root
# (utun): запускать app из-под sudo или ставить привилегированный хелпер.

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'engine/**'
      - '.github/workflows/macos-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'engine/**'
      - '.github/workflows/macos-app.yml'
  workflow_dispatch:

jobs:
  build:
    name: build Nekko.app (arm64, unsigned)
    runs-on: macos-14        # Apple Silicon
    env:
      SINGBOX_REPO: https://github.com/hoaxisr/amnezia-box.git
      SINGBOX_TAG: v1.13.8-awg2.0

    steps:
      - uses: actions/checkout@v4

      # 1.24.7 покрывает и движок (go.mod 1.23), и форк sing-box (go.mod 1.24.7).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build engine dylib (darwin/arm64)
        working-directory: engine
        env:
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -buildmode=c-shared -o "$GITHUB_WORKSPACE/libnekkobox.dylib" ./cmd/nekkobox-ffi
          file "$GITHUB_WORKSPACE/libnekkobox.dylib"

      - name: Build sing-box (awg fork, darwin/arm64)
        env:
          CGO_ENABLED: '1'          # darwin-нативно; keychain-зависимости могут требовать cgo
          GOOS: darwin
          GOARCH: arm64
          GOTOOLCHAIN: local        # используем ровно go 1.24.7 из setup-go
        run: |
          git clone --depth 1 --branch "$SINGBOX_TAG" "$SINGBOX_REPO" "$RUNNER_TEMP/singbox-src"
          cd "$RUNNER_TEMP/singbox-src"
          # Теги/ldflags — как в Makefile форка (release/*), плюс with_awg.
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS),with_awg"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          VERSION="${SINGBOX_TAG#v}"
          echo "sing-box TAGS=$TAGS VERSION=$VERSION"
          go build -v -trimpath \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION' $LDFLAGS_SHARED -s -w -buildid=" \
            -tags "$TAGS" \
            -o "$GITHUB_WORKSPACE/sing-box" \
            ./cmd/sing-box
          file "$GITHUB_WORKSPACE/sing-box"
          "$GITHUB_WORKSPACE/sing-box" version

      - name: Generate macOS scaffold + deps
        working-directory: app
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --project-name nekkobox .
          flutter pub get

      - name: Build macOS app (ad-hoc signed)
        working-directory: app
        env:
          # Ad-hoc подпись ("-"): без Apple Developer аккаунта, но обязательна
          # чтобы бинарь вообще запускался на Apple Silicon.
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
        run: flutter build macos --release

      - name: Bundle dylib + sing-box into .app and re-sign
        working-directory: app
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then echo "::error::.app not found"; exit 1; fi
          echo "APP_PATH=$APP_PATH"
          MACOS_DIR="$APP_PATH/Contents/MacOS"
          # Движок и sing-box кладём рядом с исполняемым файлом — там же, где
          # их ищет движок (baseDir = Contents/MacOS).
          cp "$GITHUB_WORKSPACE/libnekkobox.dylib" "$MACOS_DIR/"
          cp "$GITHUB_WORKSPACE/sing-box" "$MACOS_DIR/"
          chmod +x "$MACOS_DIR/sing-box"
          # Подписать вложенные Mach-O явно (--deep не всегда покрывает «голые»
          # бинари в Contents/MacOS), затем пересобрать подпись всего бандла —
          # иначе добавленные файлы ломают подпись и macOS не запустит app.
          codesign --force --sign - "$MACOS_DIR/libnekkobox.dylib"
          codesign --force --sign - "$MACOS_DIR/sing-box"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" || true
          # ditto сохраняет структуру бандла, symlink'и и подпись (в отличие
          # от обычного zip, который их портит).
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/Nekko-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nekko-macos-arm64
          path: Nekko-macos-arm64.zip
          if-no-files-found: error
