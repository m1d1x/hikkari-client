name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  SING_BOX_LX_TAG: v1.14.3-lx.21

jobs:
  # sing-box-lx with our patches (core-patches/sing-box-lx/*.patch) applied —
  # upstream packet-up xhttp sends one POST per write and chokes on 50 pps
  # UDP (Discord voice). Cross-compiled on Linux, CGO off like upstream.
  sing-box:
    name: Build patched sing-box-lx (windows-amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone sing-box-lx
        run: |
          git clone --depth 1 --branch "$SING_BOX_LX_TAG" https://github.com/Leadaxe/sing-box-lx sbx
          cd sbx
          git submodule update --init --depth 1 submodules/gvisor submodules/sing-tun submodules/utls submodules/wireguard-go
          for p in ../core-patches/sing-box-lx/*.patch; do
            echo "applying $p"
            git apply "$p"
          done

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: sbx/go.sum

      - name: Build sing-box.exe
        run: |
          cd sbx
          TAGS=$(make -s -f Makefile.lx lx-print-tags)
          VERSION="$(tr -d '[:space:]' < upstream.version)-${SING_BOX_LX_TAG##*-}-hikkari"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION' -checklinkname=0 -s -w -buildid=" \
            -o ../sing-box.exe ./cmd/sing-box
          ls -la ../sing-box.exe

      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-patched
          path: sing-box.exe
          retention-days: 3

  build:
    name: Build Windows x64
    needs: sing-box
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: engine/go.sum

      - name: Setup MinGW GCC for CGO
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download patched sing-box
        uses: actions/download-artifact@v4
        with:
          name: sing-box-patched
          path: patched-sb

      - name: Prepare native binaries (sing-box & wintun)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "archive"

          # 1. Download sing-box 1.14.3 (sing-box-lx fork with xhttp, AmneziaWG, anti-DPI patches)
          Write-Host "Downloading sing-box (lx with xhttp & awg support)..."
          Invoke-WebRequest -Uri "https://github.com/Leadaxe/sing-box-lx/releases/download/$env:SING_BOX_LX_TAG/sing-box-$($env:SING_BOX_LX_TAG.TrimStart('v'))-windows-amd64.zip" -OutFile "sing-box.zip"
          Expand-Archive -Path "sing-box.zip" -DestinationPath "temp_sb" -Force
          # Upstream zip is only used for libcronet.dll; sing-box.exe is our patched build.
          Copy-Item -Path "patched-sb/sing-box.exe" -Destination "archive/sing-box.exe"
          Get-ChildItem -Path "temp_sb" -Recurse -Filter "libcronet.dll" | Select-Object -First 1 | Copy-Item -Destination "archive/libcronet.dll"

          # 2. Download wintun 0.14.1
          Write-Host "Downloading wintun..."
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "temp_wintun" -Force
          Copy-Item -Path "temp_wintun/wintun/bin/amd64/wintun.dll" -Destination "archive/wintun.dll"

          # Cleanup temporary zip files
          Remove-Item -Recurse -Force "temp_sb", "temp_wintun", "sing-box.zip", "wintun.zip"

          Write-Host "Binaries ready in archive/:"
          Get-ChildItem -Path "archive"

      - name: Build Go Engine (nekkobox.dll)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CC = "gcc"
          cd engine
          go build -buildmode=c-shared -o ../nekkobox.dll ./cmd/nekkobox-ffi
          cd ..
          if (-not (Test-Path "nekkobox.dll")) {
            throw "nekkobox.dll was not generated!"
          }
          Write-Host "nekkobox.dll generated successfully."

      - name: Build HikkariService.exe
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          cd engine
          go build -trimpath -ldflags "-s -w -X NekkoVPN/core/winsvc.Version=$version" -o ../HikkariService.exe ./cmd/hikkari-service
          cd ..
          if (-not (Test-Path "HikkariService.exe")) { throw "HikkariService.exe was not generated!" }

      - name: Build hikkari-updater.exe
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cd updater
          cargo build --release --locked -p hikkari-updater
          Copy-Item target/release/hikkari-updater.exe ../hikkari-updater.exe

      - name: Build Flutter Windows App
        shell: pwsh
        run: |
          cd app
          flutter pub get
          flutter build windows --release
          cd ..

      # Layout of the installed client (docs/AUTOUPDATE-ROADMAP.md §1):
      #   Hikkari\HikkariService.exe     install / service
      #   Hikkari\hikkari-updater.exe
      #   Hikkari\app\                   GUI, engine, core, VERSION — what updates replace
      # Unpack and run HikkariService.exe: one UAC prompt, it copies itself to
      # Program Files\Hikkari and starts the service.
      - name: Assemble Release Bundle
        shell: pwsh
        run: |
          $releaseDir = "app/build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            throw "Release directory does not exist: $releaseDir"
          }

          $bundle = "bundle/Hikkari"
          New-Item -ItemType Directory -Force -Path "$bundle/app" | Out-Null
          Copy-Item -Recurse -Force "$releaseDir/*" -Destination "$bundle/app/"

          # Engine and core binaries live in app\ beside the GUI.
          Copy-Item -Force "nekkobox.dll" -Destination "$bundle/app/"
          Copy-Item -Force "archive/sing-box.exe" -Destination "$bundle/app/"
          Copy-Item -Force "archive/wintun.dll" -Destination "$bundle/app/"
          if (Test-Path "archive/libcronet.dll") {
            Copy-Item -Force "archive/libcronet.dll" -Destination "$bundle/app/"
          }

          # The installed version, read by hikkari-updater (covered by the manifest).
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          Set-Content -NoNewline -Encoding ascii -Path "$bundle/app/VERSION" -Value $version

          Copy-Item -Force "HikkariService.exe" -Destination "$bundle/"
          Copy-Item -Force "hikkari-updater.exe" -Destination "$bundle/"

          Write-Host "Bundle ($version):"
          Get-ChildItem -Recurse -Path "bundle" | Select-Object FullName

          Compress-Archive -Path "bundle/Hikkari" -DestinationPath "hikkari-windows-x64.zip" -Force
          Write-Host "hikkari-windows-x64.zip created successfully."

      # The runner is elevated, which makes it the one place the privileged
      # half can be exercised for real: install from the bundle, talk to the
      # pipe, bring up a TUN through the service, take it down, uninstall.
      # auto_route stays off so the runner's own traffic is never rerouted.
      - name: Service smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & bundle/Hikkari/HikkariService.exe install --quiet
          if ($LASTEXITCODE -ne 0) { throw "install failed ($LASTEXITCODE)" }
          $root = "$env:ProgramFiles\Hikkari"
          if ((Get-Service HikkariService).Status -ne 'Running') { throw "service is not running" }
          if (-not (Test-Path "$root\app\sing-box.exe")) { throw "build was not copied to $root" }

          function Invoke-Hikkari([string]$json) {
            $pipe = New-Object System.IO.Pipes.NamedPipeClientStream(".", "hikkari-service", [System.IO.Pipes.PipeDirection]::InOut)
            $pipe.Connect(5000)
            $w = New-Object System.IO.StreamWriter($pipe); $w.AutoFlush = $true
            $r = New-Object System.IO.StreamReader($pipe)
            $w.WriteLine($json)
            $line = $r.ReadLine()
            $pipe.Dispose()
            Write-Host "<- $line"
            return $line | ConvertFrom-Json
          }

          try {
            $st = Invoke-Hikkari '{"op":"status"}'
            if (-not $st.ok -or $st.running) { throw "unexpected status" }

            $bad = Invoke-Hikkari '{"op":"start","config":{"inbounds":[],"services":[]}}'
            if ($bad.ok) { throw "the service accepted a config with a forbidden section" }
            $bad = Invoke-Hikkari '{"op":"start","config":{"inbounds":[],"outbounds":[{"type":"direct","tag":"d","tls":{"certificate_path":"C:\\Windows\\win.ini"}}]}}'
            if ($bad.ok) { throw "the service accepted a config that reads a file" }

            $cfg = '{"log":{"level":"info","timestamp":true},"dns":{"servers":[{"tag":"local","type":"local"}]},"inbounds":[{"type":"tun","tag":"tun-in","address":["172.19.0.1/30"],"auto_route":false,"stack":"mixed"}],"outbounds":[{"type":"direct","tag":"direct"}],"route":{"final":"direct","default_domain_resolver":{"server":"local"}},"experimental":{"clash_api":{"external_controller":"127.0.0.1:9090"},"cache_file":{"enabled":true,"path":"cache.db"}}}'
            $st = Invoke-Hikkari ('{"op":"start","config":' + $cfg + '}')
            if (-not $st.ok -or -not $st.running) { throw "the core did not start" }

            $up = $false
            for ($i = 0; $i -lt 20 -and -not $up; $i++) {
              Start-Sleep -Milliseconds 500
              try { $v = Invoke-RestMethod -TimeoutSec 2 http://127.0.0.1:9090/version; $up = $true; Write-Host "core: $($v | ConvertTo-Json -Compress)" } catch {}
            }
            if (-not $up) { throw "the core never answered on the Clash API" }
            if (-not (Test-Path "$root\core\cache.db")) { throw "cache.db is not in the service's directory" }

            $st = Invoke-Hikkari '{"op":"stop"}'
            if ($st.running) { throw "the core is still running after stop" }
          } finally {
            Write-Host "---- service.log ----"
            Get-Content "$root\core\service.log" -ErrorAction SilentlyContinue
            & "$root\HikkariService.exe" uninstall --quiet
          }
          if (Get-Service HikkariService -ErrorAction SilentlyContinue) { throw "the service is still registered" }

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikkari-windows-x64
          path: hikkari-windows-x64.zip
          retention-days: 14
